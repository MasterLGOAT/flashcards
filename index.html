<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2F6F4E">
<title>Recall</title>
<style>
:root {
  --paper: #EEF0EC;
  --paper-card: #FBF9F3;
  --ink: #1E2A26;
  --ink-soft: #5B6B63;
  --accent: #2F6F4E;
  --accent-hover: #255A3F;
  --accent-tint: #E1EBE4;
  --gold: #B8923F;
  --rule-red: #A8433F;
  --hard-amber: #BD7A3A;
  --border: #DCDFD6;
  --shadow-rgb: 30,41,38;
  --font-serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #141B18;
    --paper-card: #1C2620;
    --ink: #EDEAE0;
    --ink-soft: #9CA89F;
    --accent: #5FA37D;
    --accent-hover: #74B892;
    --accent-tint: #22322A;
    --gold: #D4B168;
    --rule-red: #C1615C;
    --hard-amber: #D69457;
    --border: #2C3830;
    --shadow-rgb: 0,0,0;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
#app { min-height: 100vh; display: flex; flex-direction: column; }
button, input, textarea, select { font-family: inherit; color: inherit; font-size: 1rem; }
button { cursor: pointer; }
textarea { line-height: 1.4; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.25rem 1.5rem 0.5rem;
  max-width: 640px; width: 100%; margin: 0 auto; gap: 0.5rem;
}
.brand { display: flex; align-items: center; gap: 0.35rem; }
.brand-mark { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; }
.icon-btn {
  background: none; border: none; padding: 0.55rem; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-soft); transition: background 0.15s, color 0.15s; flex-shrink: 0;
}
.icon-btn:hover { background: var(--accent-tint); color: var(--accent); }
.icon-btn.active { color: var(--accent); }

.view-wrap { flex: 1; max-width: 640px; width: 100%; margin: 0 auto; padding: 0.5rem 1.5rem 3rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  padding: 0.75rem 1.15rem; border-radius: 12px; border: 1px solid transparent;
  font-size: 0.95rem; font-weight: 600; transition: transform 0.1s, background 0.15s, border-color 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--ink); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-text { background: none; border: none; color: var(--ink-soft); font-weight: 500; padding: 0.4rem 0.2rem; font-size: 0.85rem; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border); }
.btn-text:hover { color: var(--accent); text-decoration-color: var(--accent); }
.btn-danger-text { color: var(--rule-red); }
.btn-block { width: 100%; }
.btn-sm { padding: 0.5rem 0.85rem; font-size: 0.85rem; border-radius: 9px; }

.notice-banner {
  background: var(--accent-tint); border-radius: 14px; padding: 1rem 1.25rem; margin: 0.5rem 0 1.25rem;
  font-size: 0.88rem; color: var(--ink);
}
.notice-banner.warn { border: 1px solid var(--rule-red); }

.due-banner {
  background: var(--accent-tint); border-radius: 14px; padding: 1rem 1.25rem;
  margin: 0.5rem 0 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.due-banner-text { font-size: 0.95rem; }
.due-banner-count { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; color: var(--accent); }
.streak-pill { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 0.75rem; }

.deck-list { border-top: 1px solid var(--border); }
.deck-row {
  display: flex; align-items: center; gap: 0.9rem; padding: 1rem 0.25rem;
  border: none; border-bottom: 1px solid var(--border); background: none;
  width: 100%; text-align: left;
}
.deck-row:hover .deck-name { color: var(--accent); }
.deck-tab { width: 4px; align-self: stretch; border-radius: 3px; background: var(--accent); flex-shrink: 0; min-height: 2.75rem; }
.deck-tab.idle { background: var(--border); }
.deck-info { flex: 1; min-width: 0; }
.deck-name { font-size: 1.05rem; font-weight: 600; margin: 0 0 0.2rem; transition: color 0.15s; }
.deck-meta { font-size: 0.85rem; color: var(--ink-soft); }
.deck-stage-bar { height: 4px; border-radius: 2px; overflow: hidden; display: flex; margin-top: 0.55rem; background: var(--border); max-width: 220px; }
.deck-stage-bar span { height: 100%; }
.due-pill {
  background: var(--rule-red); color: #fff; font-size: 0.8rem; font-weight: 700;
  padding: 0.3rem 0.65rem; border-radius: 999px; flex-shrink: 0; min-width: 1.6rem; text-align: center;
}
.deck-chevron { color: var(--ink-soft); flex-shrink: 0; }

.empty-state { text-align: center; padding: 3rem 1rem; }
.empty-state h2 { font-family: var(--font-serif); font-size: 1.5rem; margin-bottom: 0.6rem; }
.empty-state p { color: var(--ink-soft); max-width: 34ch; margin: 0 auto 1.75rem; }

.footer-links { display: flex; gap: 1.5rem; justify-content: center; margin-top: 2.5rem; flex-wrap: wrap; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; padding: 0; }

.import-panel h2, .manage-header h2 { font-family: var(--font-serif); font-size: 1.4rem; margin: 0.5rem 0 1.25rem; font-weight: 700; }
.dropzone {
  border: 2px dashed var(--border); border-radius: 16px; padding: 2.75rem 1.5rem;
  text-align: center; transition: border-color 0.15s, background 0.15s; color: var(--ink-soft);
}
.dropzone.dragover { border-color: var(--accent); background: var(--accent-tint); }
.dropzone strong { color: var(--ink); }
.dropzone p { margin: 0.6rem 0 0; font-size: 0.9rem; }
.dropzone .icon-wrap { color: var(--ink-soft); }

.field { margin-bottom: 1.1rem; }
.field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--ink-soft); }
.field input[type=text], .field textarea, .field select {
  width: 100%; padding: 0.7rem 0.85rem; border-radius: 10px; border: 1px solid var(--border);
  background: var(--paper-card);
}
.field textarea { resize: vertical; min-height: 4.5rem; }

.import-preview { background: var(--paper-card); border-radius: 14px; padding: 1.25rem; margin-top: 0.25rem; border: 1px solid var(--border); }
.import-preview-count { font-family: var(--font-serif); font-size: 1.25rem; margin: 0 0 0.9rem; }
.preview-row { display: flex; gap: 0.75rem; padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; color: var(--ink-soft); }
.preview-row:last-child { border-bottom: none; }
.preview-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.search-input {
  width: 100%; padding: 0.65rem 0.9rem; border-radius: 10px; border: 1px solid var(--border);
  background: var(--paper-card); margin-bottom: 1rem;
}
.manage-title-input {
  font-family: var(--font-serif); font-size: 1.35rem; font-weight: 700; border: none; background: none;
  width: 100%; border-bottom: 1px solid transparent; padding: 0.15rem 0;
}
.manage-title-input:focus { outline: none; border-bottom-color: var(--accent); }
.manage-meta { font-size: 0.85rem; color: var(--ink-soft); margin: 0.15rem 0 1.1rem; }

.tts-settings { display: flex; flex-direction: column; gap: 0.75rem; margin: 0.85rem 0 1.1rem; }
.tts-field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 0.3rem; }
.tts-field-row { display: flex; align-items: center; gap: 0.5rem; }
.tts-field-row select { flex: 1; min-width: 0; padding: 0.6rem 0.7rem; border-radius: 9px; border: 1px solid var(--border); background: var(--paper-card); font-size: 0.9rem; }
.tts-test-btn { background: var(--accent-tint); border: none; border-radius: 8px; padding: 0.55rem; color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.study-topline { display: flex; align-items: center; justify-content: space-between; margin: 0.25rem 0 0.75rem; font-size: 0.85rem; color: var(--ink-soft); }
.progress-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 1.75rem; }
.progress-fill { height: 100%; background: var(--accent); }

.card-stage { position: relative; padding: 0.5rem 0 1.75rem; display: flex; justify-content: center; }
.flashcard { position: relative; width: 100%; max-width: 400px; aspect-ratio: 3 / 4; margin: 0 auto; perspective: 1600px; }
.flashcard::before, .flashcard::after {
  content: ''; position: absolute; inset: 0; background: var(--paper-card); border: 1px solid var(--border);
  border-radius: 18px; z-index: 0;
}
.flashcard::before { transform: rotate(-4deg) translateY(4px); opacity: 0.5; }
.flashcard::after { transform: rotate(3deg) translateY(2px); opacity: 0.75; }
.flashcard-inner {
  position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.4,0.15,0.2,1);
  cursor: pointer; z-index: 1;
}
.study-card-area.flipped .flashcard-inner { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--paper-card); border-radius: 18px; border: 1px solid var(--border);
  box-shadow: 0 10px 30px -8px rgba(var(--shadow-rgb), 0.28);
  display: flex; padding: 2rem 1.6rem; overflow: hidden;
}
.card-face::before {
  content: ''; position: absolute; left: 1.4rem; top: 0; bottom: 0; width: 1px; background: var(--rule-red); opacity: 0.5;
}
.card-back { transform: rotateY(180deg); }
.card-face-content {
  flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: var(--font-serif); font-size: clamp(1.4rem, 5.5vw, 2.1rem); line-height: 1.25; padding-left: 0.75rem;
  word-break: break-word; hyphens: auto;
}
.card-back .card-face-content { font-size: clamp(1.1rem, 4vw, 1.45rem); }

.flip-hint { text-align: center; font-size: 0.85rem; color: var(--ink-soft); margin: 0; }
.study-card-area.flipped .flip-hint { display: none; }
.kbd-hint { display: none; }
@media (hover: hover) and (pointer: fine) { .kbd-hint { display: inline; } }

.grade-row { display: none; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; margin-top: 0; }
.study-card-area.flipped .grade-row { display: grid; }
.grade-btn {
  display: flex; flex-direction: column; align-items: center; gap: 0.3rem; padding: 0.8rem 0.4rem;
  border-radius: 12px; border: 1px solid var(--border); background: var(--paper-card); font-weight: 700; font-size: 0.88rem;
}
.grade-btn .interval { font-weight: 500; font-size: 0.72rem; color: var(--ink-soft); }
.grade-again { color: var(--rule-red); border-color: var(--rule-red); }
.grade-hard { color: var(--hard-amber); border-color: var(--hard-amber); }
.grade-good { color: var(--accent); border-color: var(--accent); }
.grade-easy { color: var(--gold); border-color: var(--gold); }

.speak-btn {
  position: absolute; top: 0.85rem; right: 0.85rem; z-index: 2;
  background: var(--accent-tint); border: none; border-radius: 999px; padding: 0.5rem;
  color: var(--accent); display: flex; align-items: center; justify-content: center;
}
.speak-btn:active { transform: scale(0.92); }

.session-end { text-align: center; padding: 3.5rem 1rem; }
.session-end h2 { font-family: var(--font-serif); font-size: 1.6rem; margin-bottom: 0.6rem; }
.session-end p { color: var(--ink-soft); margin-bottom: 1.75rem; }
.session-end .btn-row { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }

.card-row { border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem 1rem; margin-bottom: 0.6rem; background: var(--paper-card); }
.card-row-view { display: flex; align-items: flex-start; gap: 0.75rem; }
.card-row-text { flex: 1; min-width: 0; }
.card-row-front { font-weight: 600; margin: 0 0 0.2rem; }
.card-row-back { color: var(--ink-soft); font-size: 0.9rem; margin: 0; }
.card-row-due { font-size: 0.75rem; color: var(--ink-soft); margin-top: 0.4rem; }
.card-row-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
.card-edit-actions { display: flex; gap: 0.6rem; margin-top: 0.6rem; justify-content: flex-end; }
.add-card-panel { border: 1px dashed var(--border); border-radius: 12px; padding: 1rem; margin-top: 0.75rem; }

.toast {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--paper); padding: 0.75rem 1.25rem; border-radius: 10px;
  font-size: 0.88rem; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 50;
  max-width: calc(100vw - 3rem); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 480px) {
  .grade-row { gap: 0.4rem; }
  .grade-btn { font-size: 0.78rem; padding: 0.7rem 0.2rem; }
}

/* --- Match --- */
.match-topline { display: flex; align-items: center; justify-content: space-between; margin: 0.25rem 0 1rem; font-size: 0.9rem; color: var(--ink-soft); }
.match-timer { font-family: var(--font-serif); font-weight: 700; color: var(--accent); font-size: 1.15rem; }
.match-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.55rem; }
@media (min-width: 480px) { .match-grid { grid-template-columns: repeat(4, 1fr); } }
.match-tile {
  background: var(--paper-card); border: 1px solid var(--border); border-radius: 10px;
  padding: 0.75rem 0.5rem; min-height: 4.75rem; display: flex; align-items: center; justify-content: center;
  text-align: center; font-size: 0.82rem; line-height: 1.3; word-break: break-word;
  transition: opacity 0.3s, transform 0.3s, background 0.15s, border-color 0.15s;
}
.match-tile.selected { border-color: var(--accent); background: var(--accent-tint); }
.match-tile.wrong { border-color: var(--rule-red); animation: tile-shake 0.4s; pointer-events: none; }
.match-tile.matched { opacity: 0; transform: scale(0.85); pointer-events: none; }
@keyframes tile-shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

/* --- Learn --- */
.learn-prompt-label { font-size: 0.8rem; color: var(--ink-soft); text-align: center; margin-bottom: 0.5rem; }
.learn-prompt {
  font-family: var(--font-serif); font-size: clamp(1.3rem, 5vw, 1.8rem); text-align: center;
  background: var(--paper-card); border: 1px solid var(--border); border-radius: 16px;
  padding: 1.75rem 1.25rem; margin-bottom: 1.25rem;
}
.learn-options { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
.learn-option { background: var(--paper-card); border: 1px solid var(--border); border-radius: 12px; padding: 0.85rem 1rem; text-align: left; font-size: 0.95rem; width: 100%; }
.learn-option:not(.locked):active { transform: scale(0.98); }
.learn-option.locked { opacity: 0.7; }
.option-correct { border-color: var(--accent); background: var(--accent-tint); opacity: 1; font-weight: 600; }
.option-wrong { border-color: var(--rule-red); opacity: 1; }
.learn-feedback { text-align: center; font-weight: 600; padding: 0.75rem; border-radius: 10px; margin-bottom: 0.5rem; }
.learn-feedback.is-correct { color: var(--accent); background: var(--accent-tint); }
.learn-feedback.is-wrong { color: var(--rule-red); }
.learn-override-row { text-align: center; margin-bottom: 0.5rem; }

/* --- Free Fall --- */
.fallzone { position: relative; height: 320px; border: 1px solid var(--border); border-radius: 16px; background: var(--paper-card); overflow: hidden; margin-bottom: 1rem; }
.fallzone::after { content: ''; position: absolute; left: 0; right: 0; bottom: 44px; height: 2px; background: var(--rule-red); opacity: 0.4; }
.fall-tile {
  position: absolute; left: 8%; right: 8%; top: -12%;
  background: var(--accent-tint); border: 1px solid var(--accent); border-radius: 10px;
  padding: 0.6rem 0.75rem; text-align: center; font-weight: 600; font-size: 0.95rem;
  animation-name: fall-drop; animation-timing-function: linear; animation-fill-mode: forwards;
}
.fall-tile.caught { animation-play-state: paused; opacity: 0; transform: scale(1.15); transition: opacity 0.3s, transform 0.3s; }
@keyframes fall-drop { from { top: -12%; } to { top: 90%; } }
.lives { letter-spacing: 0.1em; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .flashcard-inner, .match-tile { transition: none !important; }
}
.folder-head { display: flex; align-items: center; border-bottom: 1px solid var(--border); }
.folder-row { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.7rem; padding: 0.95rem 0.25rem; border: none; background: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
.folder-icon { color: var(--accent); display: flex; flex-shrink: 0; }
.folder-name { flex: 1; min-width: 0; font-weight: 600; font-size: 1.05rem; }
.folder-chevron { display: flex; color: var(--ink-soft); transition: transform 0.15s; }
.folder-chevron.open { transform: rotate(90deg); }
.folder-body { margin-left: 0.7rem; padding-left: 0.9rem; border-left: 2px solid var(--accent-tint); }
.modal-backdrop { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(30, 42, 38, 0.5); }
.modal { width: 100%; max-width: 26rem; max-height: 90vh; overflow: auto; padding: 1.25rem; border-radius: 14px; background: var(--paper-card); }
.modal h3 { margin: 0 0 0.5rem; font-size: 1.1rem; }
.modal p { margin: 0 0 1rem; font-size: 0.92rem; color: var(--ink-soft); }
.modal-actions { display: flex; flex-direction: column; gap: 0.5rem; }
</style>
</head>
<body>
<input type="file" id="restore-input" class="visually-hidden" tabindex="-1" aria-hidden="true">
<div id="app"></div>
<div id="toast" class="toast" aria-live="polite"></div>
<noscript>Recall needs JavaScript enabled to run.</noscript>
<script>
// ---------------------------------------------------------------------
// Icons
// ---------------------------------------------------------------------
const ICONS = {
  folder: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  trash: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>',
  edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  chevron: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  upload: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>',
  bell: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  speaker: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>'
};

// ---------------------------------------------------------------------
// Storage
// ---------------------------------------------------------------------
const STORAGE_KEY = 'recall_app_state_v1';

function testStorage() {
  try {
    localStorage.setItem('__recall_probe__', '1');
    localStorage.removeItem('__recall_probe__');
    return true;
  } catch (e) { return false; }
}
const storageAvailable = testStorage();

function defaultState() {
  return { decks: [], folders: [], streak: { count: 0, lastStudyDate: null, longest: 0 } };
}

// Cleans any saved or restored data so a malformed file can never break the app.
function normalizeState(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.decks)) throw new Error("That file doesn't contain any Recall decks.");
  const used = new Set();
  const uid = function (id) {
    if (typeof id !== 'string' || !/^[A-Za-z0-9_-]{1,64}$/.test(id) || used.has(id)) id = generateId();
    used.add(id);
    return id;
  };
  const folders = (Array.isArray(raw.folders) ? raw.folders : []).filter(function (f) { return f && typeof f === 'object'; }).map(function (f) {
    return Object.assign({}, f, { id: uid(f.id), name: String(f.name || 'Untitled folder'), collapsed: !!f.collapsed });
  });
  const folderIds = new Set(folders.map(function (f) { return f.id; }));
  const decks = raw.decks.filter(function (d) { return d && typeof d === 'object'; }).map(function (d) {
    const cards = (Array.isArray(d.cards) ? d.cards : []).filter(function (c) { return c && typeof c === 'object' && c.front != null; }).map(function (c) {
      const card = Object.assign(initSchedule(), c, { id: uid(c.id), front: String(c.front), back: String(c.back == null ? '' : c.back) });
      if (typeof card.dueDate !== 'string') card.dueDate = todayISO();
      return card;
    });
    return Object.assign({ frontLang: '', backLang: '' }, d, { id: uid(d.id), name: String(d.name || 'Untitled deck'), cards: cards, folderId: folderIds.has(d.folderId) ? d.folderId : null });
  });
  return Object.assign({}, raw, { decks: decks, folders: folders, streak: Object.assign({ count: 0, lastStudyDate: null, longest: 0 }, raw.streak) });
}

function loadState() {
  if (!storageAvailable) return defaultState();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? normalizeState(JSON.parse(raw)) : defaultState();
  } catch (e) {
    try { const bad = localStorage.getItem(STORAGE_KEY); if (bad) localStorage.setItem(STORAGE_KEY + '_unreadable', bad); } catch (e2) {}
    return defaultState();
  }
}

function saveState() {
  if (!storageAvailable) return false;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); return true; }
  catch (e) { showToast("Couldn't save — storage may be full or blocked."); return false; }
}

function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function addDaysISO(iso, days) {
  const parts = iso.split('-').map(Number);
  const utcMs = Date.UTC(parts[0], parts[1] - 1, parts[2]) + days * 86400000;
  return new Date(utcMs).toISOString().slice(0, 10);
}
function formatDateHuman(iso) {
  const today = todayISO();
  if (iso <= today) return 'now';
  if (iso === addDaysISO(today, 1)) return 'tomorrow';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function formatInterval(days) {
  if (days < 30) return days + 'd';
  if (days < 365) return Math.round(days / 30) + 'mo';
  return (days / 365).toFixed(1) + 'y';
}
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function csvEscapeField(s) {
  s = String(s ?? '');
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadBlob(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------------------------------------------------------------------
// CSV parsing
// ---------------------------------------------------------------------
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.map(r => r.map(f => f.trim())).filter(r => r.some(f => f.length > 0));
}
function looksLikeHeader(row) {
  const words = ['term', 'front', 'question', 'word', 'prompt', 'definition', 'back', 'answer', 'meaning', 'translation'];
  return row.some(cell => words.includes(cell.toLowerCase().trim()));
}

// ---------------------------------------------------------------------
// SM-2 spaced repetition
// ---------------------------------------------------------------------
function initSchedule() {
  return { repetitions: 0, interval: 0, easeFactor: 2.5, dueDate: todayISO(), lastReviewed: null };
}
function scheduleNext(card, quality) {
  if (quality < 3) {
    card.repetitions = 0;
    card.interval = 1;
  } else {
    if (card.repetitions === 0) card.interval = 1;
    else if (card.repetitions === 1) card.interval = 6;
    else card.interval = Math.round(card.interval * card.easeFactor);
    card.repetitions += 1;
  }
  card.easeFactor = Math.max(1.3, card.easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  card.lastReviewed = todayISO();
  card.dueDate = addDaysISO(todayISO(), card.interval);
  return card;
}
function previewInterval(card, quality) {
  const clone = { repetitions: card.repetitions, interval: card.interval, easeFactor: card.easeFactor };
  scheduleNext(clone, quality);
  return clone.interval;
}
function isDue(card) { return card.dueDate <= todayISO(); }
function cardStage(card) {
  if (card.repetitions === 0) return 'new';
  if (card.interval < 21) return 'learning';
  return 'mastered';
}
function deckStageBreakdown(deck) {
  let n = 0, l = 0, m = 0;
  deck.cards.forEach(c => { const s = cardStage(c); if (s === 'new') n++; else if (s === 'learning') l++; else m++; });
  return { n, l, m, total: deck.cards.length };
}

function recordStudyActivity() {
  const today = todayISO();
  if (appState.streak.lastStudyDate === today) return;
  const yesterday = addDaysISO(today, -1);
  appState.streak.count = (appState.streak.lastStudyDate === yesterday) ? appState.streak.count + 1 : 1;
  appState.streak.lastStudyDate = today;
  if (appState.streak.count > appState.streak.longest) appState.streak.longest = appState.streak.count;
}

// ---------------------------------------------------------------------
// Answer matching (shared by Learn and Free Fall)
// ---------------------------------------------------------------------
function stripAccents(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function normalizeAnswer(s) {
  return String(s || '').trim().toLowerCase().replace(/[.,!?;:'"()]/g, '').replace(/\s+/g, ' ');
}
function answersMatch(userAns, correctAns) {
  const u = normalizeAnswer(userAns), c = normalizeAnswer(correctAns);
  if (!u) return { correct: false, accentNote: false };
  if (u === c) return { correct: true, accentNote: false };
  if (stripAccents(u) === stripAccents(c)) return { correct: true, accentNote: true };
  return { correct: false, accentNote: false };
}

// ---------------------------------------------------------------------
// Match game
// ---------------------------------------------------------------------
function startMatch(deckId) {
  if (ttsSupported) window.speechSynthesis.cancel();
  const deck = getDeck(deckId);
  if (!deck || deck.cards.length < 2) { showToast('Add at least 2 cards to play Match.'); return; }
  const pairCount = Math.min(6, deck.cards.length);
  const chosen = shuffle(deck.cards).slice(0, pairCount);
  let tiles = [];
  chosen.forEach(function (c) {
    tiles.push({ cardId: c.id, text: c.front, matched: false });
    tiles.push({ cardId: c.id, text: c.back, matched: false });
  });
  tiles = shuffle(tiles);
  recordStudyActivity();
  saveState();
  ui.matchSession = {
    deckId: deckId, tiles: tiles, selectedIndex: null, startTime: Date.now(),
    penaltyMs: 0, matchedPairs: 0, totalPairs: pairCount, finished: false,
    finalTimeMs: null, isRecord: false, intervalId: null
  };
  ui.view = 'match';
  render();
  ui.matchSession.intervalId = setInterval(updateMatchTimer, 100);
}
function updateMatchTimer() {
  const s = ui.matchSession;
  if (!s || s.finished) return;
  const el = document.getElementById('match-timer');
  if (!el) return;
  el.textContent = ((Date.now() - s.startTime + s.penaltyMs) / 1000).toFixed(1) + 's';
}
function tapMatchTile(index) {
  const s = ui.matchSession;
  if (!s || s.finished) return;
  const tile = s.tiles[index];
  if (tile.matched) return;
  const tileEl = document.querySelector('.match-tile[data-index="' + index + '"]');
  if (s.selectedIndex === null) {
    s.selectedIndex = index;
    if (tileEl) tileEl.classList.add('selected');
    return;
  }
  if (s.selectedIndex === index) {
    s.selectedIndex = null;
    if (tileEl) tileEl.classList.remove('selected');
    return;
  }
  const firstIndex = s.selectedIndex;
  const firstTile = s.tiles[firstIndex];
  const firstEl = document.querySelector('.match-tile[data-index="' + firstIndex + '"]');
  s.selectedIndex = null;
  if (firstTile.cardId === tile.cardId) {
    firstTile.matched = true; tile.matched = true;
    if (firstEl) { firstEl.classList.remove('selected'); firstEl.classList.add('matched'); }
    if (tileEl) tileEl.classList.add('matched');
    s.matchedPairs++;
    if (s.matchedPairs >= s.totalPairs) finishMatch();
  } else {
    s.penaltyMs += 1000;
    if (firstEl) { firstEl.classList.remove('selected'); firstEl.classList.add('wrong'); }
    if (tileEl) tileEl.classList.add('wrong');
    setTimeout(function () {
      if (firstEl) firstEl.classList.remove('wrong');
      if (tileEl) tileEl.classList.remove('wrong');
    }, 500);
  }
}
function finishMatch() {
  const s = ui.matchSession;
  if (!s || s.finished) return;
  s.finished = true;
  clearInterval(s.intervalId);
  const elapsedMs = Date.now() - s.startTime + s.penaltyMs;
  s.finalTimeMs = elapsedMs;
  const deck = getDeck(s.deckId);
  const isRecord = !deck.matchBest || elapsedMs < deck.matchBest;
  if (isRecord) { deck.matchBest = elapsedMs; saveState(); }
  s.isRecord = isRecord;
  setTimeout(render, 600);
}

// ---------------------------------------------------------------------
// Learn (progressive mastery quiz)
// ---------------------------------------------------------------------
const LEARN_ROUND_SIZE = 7;
function learnMasteredCount(deck) {
  return deck.cards.filter(function (c) { return (c.learnLevel || 0) >= 2; }).length;
}
function startLearn(deckId) {
  if (ttsSupported) window.speechSynthesis.cancel();
  const deck = getDeck(deckId);
  if (!deck || deck.cards.length < 4) { showToast('Add at least 4 cards to use Learn.'); return; }
  const remaining = shuffle(deck.cards.filter(function (c) { return (c.learnLevel || 0) < 2; }).map(function (c) { return c.id; }));
  if (remaining.length === 0) {
    ui.learnSession = { deckId: deckId, allMastered: true };
    ui.view = 'learn';
    render();
    return;
  }
  const queue = remaining.splice(0, LEARN_ROUND_SIZE);
  ui.learnSession = { deckId: deckId, queue: queue, pending: remaining, allMastered: false, finished: false, feedback: null };
  advanceLearnQuestion();
}
function advanceLearnQuestion() {
  const s = ui.learnSession;
  const deck = getDeck(s.deckId);
  if (s.queue.length === 0) {
    if (s.pending.length > 0) {
      s.queue = s.pending.splice(0, LEARN_ROUND_SIZE);
    } else {
      s.finished = true;
      ui.view = 'learn';
      render();
      return;
    }
  }
  const cardId = s.queue.shift();
  const card = deck.cards.find(function (c) { return c.id === cardId; });
  s.currentCardId = cardId;
  s.feedback = null;
  const level = card.learnLevel || 0;
  s.questionType = level >= 1 ? 'written' : 'choice';
  if (s.questionType === 'choice') {
    const correctText = card.back;
    const others = deck.cards.filter(function (c) { return c.id !== card.id && c.back !== correctText; }).map(function (c) { return c.back; });
    const uniqueOthers = others.filter(function (text, idx) { return others.indexOf(text) === idx; });
    const distractors = shuffle(uniqueOthers).slice(0, 3);
    s.choiceOptions = shuffle([correctText].concat(distractors));
  }
  ui.view = 'learn';
  render();
}
function commitLearnLevel(deck, card, correct) {
  card.learnLevel = correct ? (card.learnLevel || 0) + 1 : 0;
  if ((card.learnLevel || 0) < 2) ui.learnSession.queue.push(card.id);
  recordStudyActivity();
  saveState();
  ui.learnSession.feedback.committed = true;
}
function answerLearnChoice(deckId, pickedText) {
  const s = ui.learnSession;
  const deck = getDeck(deckId);
  const card = deck.cards.find(function (c) { return c.id === s.currentCardId; });
  const correct = pickedText === card.back;
  s.feedback = { correct: correct, pickedText: pickedText, correctText: card.back };
  commitLearnLevel(deck, card, correct);
  render();
}
function submitLearnWritten(deckId) {
  const s = ui.learnSession;
  const deck = getDeck(deckId);
  const card = deck.cards.find(function (c) { return c.id === s.currentCardId; });
  const input = document.getElementById('learn-written-input');
  const userAns = input ? input.value : '';
  const result = answersMatch(userAns, card.back);
  s.feedback = { correct: result.correct, accentNote: result.accentNote, pickedText: userAns, correctText: card.back };
  if (result.correct) commitLearnLevel(deck, card, true);
  render();
}
function overrideLearnCorrect(deckId) {
  const s = ui.learnSession;
  const deck = getDeck(deckId);
  const card = deck.cards.find(function (c) { return c.id === s.currentCardId; });
  commitLearnLevel(deck, card, true);
  s.feedback.correct = true;
  s.feedback.overridden = true;
  render();
}
function continueLearn() {
  const s = ui.learnSession;
  const deck = getDeck(s.deckId);
  const card = deck.cards.find(function (c) { return c.id === s.currentCardId; });
  if (s.feedback && !s.feedback.committed) commitLearnLevel(deck, card, false);
  advanceLearnQuestion();
}
function resetLearnProgress(deckId) {
  const deck = getDeck(deckId);
  if (!confirm('Reset Learn progress for "' + deck.name + '"? This starts mastery over from scratch — your Study progress is unaffected.')) return;
  deck.cards.forEach(function (c) { c.learnLevel = 0; });
  saveState();
  startLearn(deckId);
}

// Free Fall (typed recall against the clock)
// ---------------------------------------------------------------------
const FREEFALL_START_LIVES = 3;
const FREEFALL_START_DURATION = 9;
const FREEFALL_MIN_DURATION = 3.5;
const FREEFALL_SPEEDUP = 0.3;
function startFreefall(deckId) {
  if (ttsSupported) window.speechSynthesis.cancel();
  const deck = getDeck(deckId);
  if (!deck || deck.cards.length < 3) { showToast('Add at least 3 cards to play Free Fall.'); return; }
  recordStudyActivity();
  saveState();
  ui.freefallSession = {
    deckId: deckId, lives: FREEFALL_START_LIVES, score: 0,
    queue: shuffle(deck.cards.map(function (c) { return c.id; })),
    duration: FREEFALL_START_DURATION, currentCardId: null, tileVersion: 0,
    resolved: false, finished: false, isRecord: false
  };
  ui.view = 'freefall';
  spawnFreefallTerm();
}
function spawnFreefallTerm() {
  const s = ui.freefallSession;
  if (!s || s.finished) return;
  if (s.queue.length === 0) { const deck = getDeck(s.deckId); s.queue = shuffle(deck.cards.map(function (c) { return c.id; })); }
  s.currentCardId = s.queue.shift();
  s.tileVersion++;
  s.resolved = false;
  ui.view = 'freefall';
  render();
  const input = document.getElementById('freefall-input');
  if (input) input.focus();
}
function freefallTileLanded(version) {
  const s = ui.freefallSession;
  if (!s || s.finished || s.resolved || version !== s.tileVersion) return;
  s.resolved = true;
  s.lives--;
  if (s.lives <= 0) { setTimeout(finishFreefall, 300); return; }
  setTimeout(spawnFreefallTerm, 500);
}
function submitFreefall(deckId) {
  const s = ui.freefallSession;
  if (!s || s.resolved) return;
  const deck = getDeck(deckId);
  const card = deck.cards.find(function (c) { return c.id === s.currentCardId; });
  const input = document.getElementById('freefall-input');
  const val = input ? input.value : '';
  const result = answersMatch(val, card.back);
  if (result.correct) {
    s.resolved = true;
    s.score++;
    s.duration = Math.max(FREEFALL_MIN_DURATION, s.duration - FREEFALL_SPEEDUP);
    const tileEl = document.querySelector('.fall-tile');
    if (tileEl) tileEl.classList.add('caught');
    if (input) input.value = '';
    setTimeout(spawnFreefallTerm, 350);
  } else {
    showToast('Not quite — keep trying!');
    if (input) { input.value = ''; input.focus(); }
  }
}
function finishFreefall() {
  if (!ui.freefallSession) return;
  const s = ui.freefallSession;
  s.finished = true;
  const deck = getDeck(s.deckId);
  const isRecord = !deck.freefallBest || s.score > deck.freefallBest;
  if (isRecord) { deck.freefallBest = s.score; saveState(); }
  s.isRecord = isRecord;
  ui.view = 'freefall';
  render();
}

function splitOnce(line, regex) {
  const m = line.match(regex);
  if (!m) return null;
  const front = line.slice(0, m.index).trim();
  const back = line.slice(m.index + m[0].length).trim();
  return (front && back) ? [front, back] : null;
}
function parseNotesHeuristic(text) {
  const rawLines = text.split(/\r\n|\r|\n/).filter(function (l) { return l.trim().length > 0; });
  if (rawLines.length === 0) return { pairs: [], skipped: 0, method: 'none' };
  const delimiters = [
    { name: 'tab', regex: /\t/ },
    { name: 'em dash', regex: /\s+—\s+/ },
    { name: 'en dash', regex: /\s+–\s+/ },
    { name: 'hyphen', regex: /\s+-\s+/ },
    { name: 'colon', regex: /:\s+/ },
    { name: 'equals sign', regex: /\s+=\s+/ }
  ];
  let best = null;
  delimiters.forEach(function (d) {
    let count = 0;
    rawLines.forEach(function (line) { if (splitOnce(line, d.regex)) count++; });
    if (count >= Math.ceil(rawLines.length * 0.6) && (!best || count > best.count)) best = { name: d.name, regex: d.regex, count: count };
  });
  if (best) {
    const pairs = []; let skipped = 0;
    rawLines.forEach(function (line) {
      const r = splitOnce(line, best.regex);
      if (r) pairs.push(r); else skipped++;
    });
    return { pairs: pairs, skipped: skipped, method: best.name };
  }
  if (rawLines.length >= 2 && rawLines.length % 2 === 0) {
    const pairs = [];
    for (let i = 0; i < rawLines.length; i += 2) pairs.push([rawLines[i].trim(), rawLines[i + 1].trim()]);
    return { pairs: pairs, skipped: 0, method: 'alternating lines' };
  }
  return { pairs: [], skipped: rawLines.length, method: 'none' };
}
function handlePasteAutoSplit() {
  const text = ui.pasteText;
  if (!text.trim()) { showToast('Paste some notes first.'); return; }
  const result = parseNotesHeuristic(text);

}
async function callGeminiForCards(apiKey, notesText) {
  const model = getGeminiModel();
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(apiKey);
  const prompt = "You are helping a student convert study notes into flashcards. Read the notes and extract clear term/definition pairs suitable for spaced-repetition flashcards. Use the student's own wording where possible. Return as many pairs as the notes reasonably support.\n\nNotes:\n" + notesText;
  const requestBody = {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: {
      responseMimeType: 'application/json',
      responseSchema: {
        type: 'ARRAY',
        items: { type: 'OBJECT', properties: { front: { type: 'STRING' }, back: { type: 'STRING' } }, required: ['front', 'back'] }
      }
    }
  };
  let resp;
  try {
    resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody) });
  } catch (networkErr) {
    throw new Error('Could not reach Gemini — check your internet connection.');
  }
  if (!resp.ok) {
    if (resp.status === 400) throw new Error('Gemini rejected the request — check the model name in AI settings.');
    if (resp.status === 403) throw new Error('That API key was rejected — check it in AI settings.');
    if (resp.status === 429) throw new Error('Hit the free-tier rate limit — wait a minute and try again.');
    throw new Error('Gemini returned an error (status ' + resp.status + ').');
  }
  let data;
  try { data = await resp.json(); } catch (e) { throw new Error("Got an unreadable response from Gemini."); }
  const text = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
  if (!text) throw new Error("Gemini didn't return any content — try again or simplify the notes.");
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { throw new Error("Couldn't understand Gemini's response."); }
  if (!Array.isArray(parsed)) throw new Error('Unexpected response format from Gemini.');
  return parsed.filter(function (p) { return p && p.front && p.back; }).map(function (p) { return [String(p.front), String(p.back)]; });
}
async function callOpenAICompatForCards(baseUrl, apiKey, model, notesText) {
  const url = (baseUrl || '').replace(/\/+$/, '') + '/chat/completions';
  const prompt = "You are helping a student convert study notes into flashcards. Read the notes and extract clear term/definition pairs suitable for spaced-repetition flashcards. Use the student's own wording where possible. Respond with ONLY a JSON array like [{\"front\":\"...\",\"back\":\"...\"}] — no other text, no markdown code fences, no explanation.\n\nNotes:\n" + notesText;
  let resp;
  try {
    resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify({ model: model, messages: [{ role: 'user', content: prompt }], temperature: 0.3 })
    });
  } catch (networkErr) {
    throw new Error('Could not reach the API — this may be your connection, or this provider may not allow requests directly from a browser page.');
  }
  if (!resp.ok) {
    if (resp.status === 401 || resp.status === 403) throw new Error('That API key was rejected — check it in AI settings.');
    if (resp.status === 404) throw new Error('Model or base URL not found — check both in AI settings.');
    if (resp.status === 429) throw new Error('Rate limited — wait a moment and try again.');
    throw new Error('The API returned an error (status ' + resp.status + ').');
  }
  let data;
  try { data = await resp.json(); } catch (e) { throw new Error('Got an unreadable response.'); }
  const text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!text) throw new Error("The API didn't return any content — try again or simplify the notes.");
  let jsonText = String(text).trim();
  const fenceMatch = jsonText.match(/```(?:json)?\s*([\s\S]*?)\s*```/);
  if (fenceMatch) jsonText = fenceMatch[1];
  let parsed;
  try { parsed = JSON.parse(jsonText); } catch (e) { throw new Error("Couldn't understand the response as JSON — try again."); }
  if (!Array.isArray(parsed)) throw new Error('Unexpected response format.');
  return parsed.filter(function (p) { return p && p.front && p.back; }).map(function (p) { return [String(p.front), String(p.back)]; });
}
async function handlePasteAI() {
  let text = ui.pasteText;
  if (!text.trim()) { showToast('Paste some notes first.'); return; }
  if (text.length > 12000) { text = text.slice(0, 12000); showToast('Notes were long — only the first part was sent to AI.'); }

    render();
  }
}

function handleCSVInput(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      let rows = parseCSV(String(reader.result));
      if (rows.length && looksLikeHeader(rows[0])) rows = rows.slice(1);
      rows = rows.filter(r => r[0] && r[0].trim()).map(r => [r[0], r[1] || '']);
      if (rows.length === 0) { showToast('No cards found in that file.'); return; }
      ui.importParsed = rows;
      ui.importFileName = file.name.replace(/\.csv$/i, '');
      ui.pasteSkipped = 0;
      render();
    } catch (err) { showToast("Couldn't read that file — make sure it's a CSV."); }
  };
  reader.onerror = () => showToast("Couldn't read that file.");
  reader.readAsText(file);
}

  const target = document.getElementById('import-target').value;
  const rows = ui.importParsed;
  const newCards = rows.map(r => Object.assign({ id: generateId(), front: r[0], back: r[1] }, initSchedule()));
  if (target === '__new__') {
    const nameInput = document.getElementById('import-deck-name').value.trim() || 'New deck';
    appState.decks.push({ id: generateId(), name: uniqueDeckName(nameInput), createdAt: Date.now(), cards: newCards, frontLang: '', backLang: '' });
  } else {
    getDeck(target).cards.push.apply(getDeck(target).cards, newCards);
  }
  saveState();
  showToast('Added ' + newCards.length + ' card' + (newCards.length === 1 ? '' : 's'));
  ui.importParsed = null;
  goDashboard();
}

function startStudy(deckId, includeAll) {
  if (ttsSupported) window.speechSynthesis.cancel();
  const deck = getDeck(deckId);
  if (!deck) return;
  const pool = includeAll ? deck.cards : deck.cards.filter(isDue);
  const ids = pool.map(c => c.id);
  ui.session = { deckId: deckId, queue: deck.sequential ? ids : shuffle(ids), pos: 0, flipped: false, reviewed: 0 };
  ui.view = 'study';
  render();
}
function startWeakCards(deckId) {
  if (ttsSupported) window.speechSynthesis.cancel();
  const deck = getDeck(deckId);
  if (!deck) return;
  const reviewed = deck.cards.filter(function (c) { return !!c.lastReviewed; });
  if (reviewed.length < 3) { showToast('Weak cards ranks by how you\'ve done in Study mode specifically — grade a few cards there first.'); return; }
  const sorted = reviewed.slice().sort(function (a, b) { return (a.easeFactor || 2.5) - (b.easeFactor || 2.5); });
  const pool = sorted.slice(0, Math.min(10, sorted.length));
  const ids = pool.map(function (c) { return c.id; });
  ui.session = { deckId: deckId, queue: deck.sequential ? ids : shuffle(ids), pos: 0, flipped: false, reviewed: 0 };
  ui.view = 'study';
  render();
}
function setDeckSequential(deckId, val) {
  const deck = getDeck(deckId);
  deck.sequential = val;
  saveState();
}
function studyHTML() {
  const s = ui.session;
  const deck = getDeck(s.deckId);

      '<div class="btn-row"><button class="btn btn-ghost" onclick="goDashboard()">Back to decks</button>' +
      (deck.cards.length ? '<button class="btn btn-primary" onclick="startStudy(\'' + deck.id + '\', true)">Practice all cards anyway</button>' : '') +

  if (s.pos >= s.queue.length) {
    return '<div class="session-end"><h2>Session complete</h2>' +

  const card = deck.cards.find(c => c.id === s.queue[s.pos]);

    '<div class="card-face card-back">' + (deck.backLang ? '<button class="speak-btn" data-text="' + escapeHtml(card.back) + '" data-lang="' + deck.backLang + '" onclick="event.stopPropagation(); speak(this.dataset.text, this.dataset.lang)" aria-label="Hear this word">' + ICONS.speaker + '</button>' : '') + '<div class="card-face-content">' + escapeHtml(card.back) + '</div></div>' +
    '</div></div></div>' +
    '<p class="flip-hint">Tap the card to reveal the answer <span class="kbd-hint">· Space</span></p>' +
    '<div class="grade-row">' +
    '<button class="grade-btn grade-again" onclick="gradeCard(0)">Again<span class="interval">' + formatInterval(previewInterval(card, 0)) + '</span></button>' +
    '<button class="grade-btn grade-hard" onclick="gradeCard(3)">Hard<span class="interval">' + formatInterval(previewInterval(card, 3)) + '</span></button>' +
    '<button class="grade-btn grade-good" onclick="gradeCard(4)">Good<span class="interval">' + formatInterval(previewInterval(card, 4)) + '</span></button>' +
    '<button class="grade-btn grade-easy" onclick="gradeCard(5)">Easy<span class="interval">' + formatInterval(previewInterval(card, 5)) + '</span></button>' +
    '</div></div>';

function flipCard() {
  if (!ui.session || ui.session.pos >= ui.session.queue.length) return;
  ui.session.flipped = !ui.session.flipped;
  const area = document.querySelector('.study-card-area');
  if (area) area.classList.toggle('flipped', ui.session.flipped);
}
function gradeCard(quality) {
  if (ttsSupported) window.speechSynthesis.cancel();
  const s = ui.session;
  const deck = getDeck(s.deckId);
  const card = deck.cards.find(c => c.id === s.queue[s.pos]);
  scheduleNext(card, quality);
  s.reviewed++; s.pos++; s.flipped = false;
  recordStudyActivity();
  saveState();
  render();
}
document.addEventListener('keydown', function (e) {
  if (ui.view === 'study' && ui.session && ui.session.pos < ui.session.queue.length) {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!ui.session.flipped) flipCard(); }
    else if (ui.session.flipped) {
      if (e.key === '1') gradeCard(0);
      else if (e.key === '2') gradeCard(3);
      else if (e.key === '3') gradeCard(4);
      else if (e.key === '4') gradeCard(5);
    }
  } else if (ui.view === 'learn' && ui.learnSession && !ui.learnSession.finished && !ui.learnSession.allMastered) {
    const s = ui.learnSession;
    if (!s.feedback) {
      if (s.questionType === 'choice' && ['1', '2', '3', '4'].indexOf(e.key) !== -1) {
        const idx = parseInt(e.key, 10) - 1;
        if (s.choiceOptions[idx] !== undefined) answerLearnChoice(s.deckId, s.choiceOptions[idx]);
      }
    } else if (e.key === 'Enter') {
      continueLearn();
    }
  }
});

function reRenderPreservingFocus() {
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
  render();
  if (id) {
    const el = document.getElementById(id);
    if (el && el.focus) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

  appState.decks.push(newDeck);
  saveState();
  showToast('Created "' + newDeck.name + '" with ' + newCards.length + ' card' + (newCards.length === 1 ? '' : 's'));
  openDeck(newDeck.id);
}
function saveCardEdit(deckId, cardId) {
  const deck = getDeck(deckId);
  const card = deck.cards.find(c => c.id === cardId);
  const front = document.getElementById('edit-front-' + cardId).value.trim();
  const back = document.getElementById('edit-back-' + cardId).value.trim();
  if (!front) { showToast('A card needs a term.'); return; }
  card.front = front; card.back = back;
  ui.editingCardId = null;
  saveState();
  render();
}
function deleteCard(deckId, cardId) {
  const deck = getDeck(deckId);
  const card = deck.cards.find(c => c.id === cardId);
  if (!card) return;
  if (!confirm('Delete "' + card.front + '"? This can\'t be undone.')) return;
  deck.cards = deck.cards.filter(c => c.id !== cardId);
  saveState();
  render();
}
function submitNewCard(deckId) {
  const deck = getDeck(deckId);
  const front = document.getElementById('new-card-front').value.trim();
  const back = document.getElementById('new-card-back').value.trim();
  if (!front) { showToast('A card needs a term.'); return; }
  deck.cards.push(Object.assign({ id: generateId(), front: front, back: back }, initSchedule()));
  saveState();
  render();
  const frontEl = document.getElementById('new-card-front');
  if (frontEl) frontEl.focus();
}

// ---------------------------------------------------------------------
// Export / backup
// ---------------------------------------------------------------------
function exportDeckCSV(deckId) {
  const deck = getDeck(deckId);
  const csv = deck.cards.map(c => csvEscapeField(c.front) + ',' + csvEscapeField(c.back)).join('\r\n');
  downloadBlob(deck.name + '.csv', csv, 'text/csv');
  showToast('CSV downloaded');
}
function exportBackup() {
  const data = Object.assign({}, appState, { app: 'recall', version: 2, exportedAt: new Date().toISOString() });
  downloadBlob('recall-backup-' + todayISO() + '.json', JSON.stringify(data, null, 2), 'application/json');
  showToast('Backup downloaded');
}
function handleRestoreFile(file) {
  const reader = new FileReader();
  reader.onerror = function () { showToast("Couldn't read that file. Try picking it again."); };
  reader.onload = function () {
    let incoming;
    try {
      const text = String(reader.result).replace(/^\uFEFF/, '').trim();
      if (!text) throw new Error('That file is empty.');
      let data;
      try { data = JSON.parse(text); } catch (e) { throw new Error("That isn't a backup file. Pick the recall-backup .json file."); }
      incoming = normalizeState(data);
    } catch (e) { showToast(e.message); return; }
    const n = incoming.decks.length, nf = incoming.folders.length;
    const cards = incoming.decks.reduce(function (sum, d) { return sum + d.cards.length; }, 0);
    const summary = n + ' deck' + (n === 1 ? '' : 's') + ', ' + cards + ' card' + (cards === 1 ? '' : 's') + (nf ? ', ' + nf + ' folder' + (nf === 1 ? '' : 's') : '') + ' in this backup. ';
    showModal('Restore this backup?', summary + '"Replace everything" swaps your current decks for these. "Add missing decks" keeps what you have and adds only decks that aren\'t here yet.', [
      { label: 'Replace everything', cls: 'btn-primary', fn: function () { applyRestore(incoming, false); } },
      { label: 'Add missing decks', cls: 'btn-ghost', fn: function () { applyRestore(incoming, true); } },
      { label: 'Cancel', cls: 'btn-ghost' }
    ]);
  };
  reader.readAsText(file);
}
function applyRestore(incoming, merge) {
  const prev = appState;
  let next = incoming, added = 0;
  if (merge) {
    const haveD = new Set(prev.decks.map(function (d) { return d.id; }));
    const haveF = new Set(prev.folders.map(function (f) { return f.id; }));
    const newDecks = incoming.decks.filter(function (d) { return !haveD.has(d.id); });
    const newFolders = incoming.folders.filter(function (f) { return !haveF.has(f.id); });
    added = newDecks.length;
    if (!added && !newFolders.length) { showToast('Nothing new: every deck in this backup is already here.'); return; }
    next = Object.assign({}, prev, { decks: prev.decks.concat(newDecks), folders: prev.folders.concat(newFolders) });
  }
  appState = next;
  if (!saveState() && storageAvailable) { appState = prev; showToast("Couldn't save the restored data. Nothing was changed."); return; }
  goDashboard();
  showToast(merge ? 'Added ' + added + ' deck' + (added === 1 ? '' : 's') : 'Backup restored');
}

// In-app dialog (browser confirm() boxes are blocked in some views and fail silently)
let modalActions = [];
function showModal(title, body, actions) { modalActions = actions; ui.modal = { title: title, body: body }; render(); }
function modalAction(i) {
  const a = modalActions[i];
  ui.modal = null; modalActions = [];
  if (a && a.fn) a.fn();
  render();
}
function modalHTML() {
  if (!ui.modal) return '';
  return '<div class="modal-backdrop" onclick="if(event.target===this)modalAction(' + (modalActions.length - 1) + ')"><div class="modal" role="dialog" aria-modal="true">' +
    '<h3>' + escapeHtml(ui.modal.title) + '</h3><p>' + escapeHtml(ui.modal.body) + '</p><div class="modal-actions">' +
    modalActions.map(function (a, i) { return '<button class="btn ' + (a.cls || 'btn-ghost') + '" onclick="modalAction(' + i + ')">' + escapeHtml(a.label) + '</button>'; }).join('') +
    '</div></div></div>';
}

// ---------------------------------------------------------------------
// Folders
// ---------------------------------------------------------------------
function getFolder(id) { return appState.folders.find(function (f) { return f.id === id; }); }
function toggleFolder(id) {
  const f = getFolder(id);
  if (!f) return;
  f.collapsed = !f.collapsed;
  saveState(); render();
}
function newFolderFormHTML() {
  return '<div class="add-card-panel"><p style="font-weight:600; margin:0 0 0.75rem;">New folder</p>' +
    '<div class="field" style="margin-bottom:0.75rem;"><label>Folder name</label>' +
    '<input type="text" id="new-folder-name" placeholder="e.g. Biology" onkeydown="if(event.key===\'Enter\') submitNewFolder()"></div>' +
    '<div class="card-edit-actions"><button class="btn-text" onclick="ui.creatingFolder=false; render()">Cancel</button>' +
    '<button class="btn btn-primary btn-sm" onclick="submitNewFolder()">Create folder</button></div></div>';
}
function submitNewFolder() {
  const name = document.getElementById('new-folder-name').value.trim();
  if (!name) { showToast('Give your folder a name.'); return; }
  appState.folders.push({ id: generateId(), name: name, createdAt: Date.now(), collapsed: false });
  saveState();
  ui.creatingFolder = false;
  render();
  showToast('Folder created. Open a deck to move it in.');
}
function folderHTML(f, rowFn) {
  const decks = appState.decks.filter(function (d) { return d.folderId === f.id; });
  const due = decks.reduce(function (sum, d) { return sum + d.cards.filter(isDue).length; }, 0);
  let h = '<div class="folder-head"><button class="folder-row" aria-expanded="' + !f.collapsed + '" onclick="toggleFolder(\'' + f.id + '\')">' +
    '<span class="folder-icon">' + ICONS.folder + '</span>' +
    '<span class="folder-name">' + escapeHtml(f.name) + '<span class="deck-meta" style="display:block; font-weight:400;">' + decks.length + ' deck' + (decks.length === 1 ? '' : 's') + '</span></span>' +
    (due > 0 ? '<span class="due-pill">' + due + '</span>' : '') +
    '<span class="folder-chevron ' + (f.collapsed ? '' : 'open') + '">' + ICONS.chevron + '</span></button>' +
    '<button class="btn-text" onclick="ui.editingFolderId=\'' + f.id + '\'; render()">Edit</button></div>';
  if (ui.editingFolderId === f.id) {
    h += '<div class="add-card-panel" style="margin:0.75rem 0;"><div class="field" style="margin-bottom:0.75rem;"><label>Folder name</label>' +
      '<input type="text" id="edit-folder-name" value="' + escapeHtml(f.name) + '"></div>' +
      '<div class="card-edit-actions"><button class="btn-text" onclick="deleteFolder(\'' + f.id + '\')">Delete folder</button>' +
      '<button class="btn-text" onclick="ui.editingFolderId=null; render()">Cancel</button>' +
      '<button class="btn btn-primary btn-sm" onclick="saveFolderEdit(\'' + f.id + '\')">Save</button></div></div>';
  }
  if (!f.collapsed) {
    h += '<div class="folder-body">' + (decks.length ? decks.map(function (d) { return rowFn(d); }).join('') :
      '<p class="deck-meta" style="padding:0.9rem 0.25rem;">Empty. Open a deck and choose this folder to move it in.</p>') + '</div>';
  }
  return h;
}
function saveFolderEdit(id) {
  const f = getFolder(id);
  const name = document.getElementById('edit-folder-name').value.trim();
  if (!f || !name) { showToast('Give your folder a name.'); return; }
  f.name = name; ui.editingFolderId = null;
  saveState(); render();
}
function deleteFolder(id) {
  const f = getFolder(id);
  if (!f) return;
  const n = appState.decks.filter(function (d) { return d.folderId === id; }).length;
  showModal('Delete this folder?', '"' + f.name + '" will be removed. Its ' + n + ' deck' + (n === 1 ? '' : 's') + ' will be kept and moved out of the folder.', [
    { label: 'Delete folder', cls: 'btn-primary', fn: function () {
      appState.decks.forEach(function (d) { if (d.folderId === id) d.folderId = null; });
      appState.folders = appState.folders.filter(function (x) { return x.id !== id; });
      ui.editingFolderId = null;
      saveState();
    } },
    { label: 'Cancel', cls: 'btn-ghost' }
  ]);
}
function deckFolderSelectHTML(deck) {
  if (!appState.folders.length) return '';
  return '<div class="field" style="margin:0.75rem 0 0;"><label>Folder</label><select onchange="moveDeckToFolder(\'' + deck.id + '\', this.value)">' +
    '<option value="">No folder</option>' +
    appState.folders.map(function (f) { return '<option value="' + f.id + '"' + (deck.folderId === f.id ? ' selected' : '') + '>' + escapeHtml(f.name) + '</option>'; }).join('') +
    '</select></div>';
}
function moveDeckToFolder(deckId, folderId) {
  const deck = getDeck(deckId), f = getFolder(folderId);
  deck.folderId = f ? f.id : null;
  if (f) f.collapsed = false;
  saveState();
  showToast(f ? 'Moved to ' + f.name : 'Removed from folder');
}

// ---------------------------------------------------------------------
// Toast
// ---------------------------------------------------------------------
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ---------------------------------------------------------------------
// Reminders (best-effort, in-browser only)
// ---------------------------------------------------------------------
function toggleReminders() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') { showToast('Reminders are already on.'); return; }
  if (Notification.permission === 'denied') { showToast('Reminders are blocked in your browser settings.'); return; }
  Notification.requestPermission().then(perm => {
    if (perm === 'granted') { showToast('Reminders on'); checkAndNotify(true); }
    render();
  });
}
function checkAndNotify(force) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const totalDue = appState.decks.reduce((s, d) => s + d.cards.filter(isDue).length, 0);
  if (totalDue === 0) return;
  const lastNotified = storageAvailable ? localStorage.getItem('recall_last_notified') : null;
  if (!force && lastNotified === todayISO()) return;
  try {
    new Notification('Recall', { body: totalDue + ' card' + (totalDue === 1 ? '' : 's') + ' due today.' });
    if (storageAvailable) localStorage.setItem('recall_last_notified', todayISO());
  } catch (e) {}
}

// ---------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------
document.getElementById('restore-input').addEventListener('change', function (e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (file) handleRestoreFile(file);
});
render();
setTimeout(() => checkAndNotify(false), 1200);
</script>
